# Runs the local quality gate (scripts/gate.sh) on pull requests to main (S30c, D19). macOS,
# because the gate's offline build uses sandbox-exec; no secrets and a read-only token.
name: gate

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  gate:
    runs-on: macos-26
    # A hung job would otherwise use up to six hours of macOS minutes.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.14.1
      - run: node --version && bun --version
      - run: bun install --frozen-lockfile
      - run: bun run gate
