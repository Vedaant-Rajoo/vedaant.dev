# Checks and builds the site, then uploads dist/ to Cloudflare Pages (Direct Upload, D77).
# A push to ledger_mvp makes a preview deployment; the project's production branch is main.
name: deploy

on:
  push:
    branches: [ledger_mvp]

permissions:
  contents: read

jobs:
  pages:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.14.1
      - run: node --version && bun --version
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun run build
      - run: >-
          bunx wrangler@4.150.0 pages deploy dist --project-name=vedaant-dev
          --branch="$GITHUB_REF_NAME" --commit-hash="$GITHUB_SHA"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
