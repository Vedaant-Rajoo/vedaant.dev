# The default rules, plus the retired public Last.fm key. It left the source, and no build writes
# it into dist/, but it stays in the git history, which `gitleaks git` scans. The key in use lives
# only in the host's environment, so nothing else is allowed.
[extend]
useDefault = true

[[allowlists]]
regexes = ['''^ad7d5f6085314e87eac8b6bc74a08ac2$''']
